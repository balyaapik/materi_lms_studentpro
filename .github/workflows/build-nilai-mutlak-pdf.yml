# Trigger build: 2026-08-22
name: Build Nilai Mutlak PDF

on:
  push:
    paths:
      - '.github/workflows/build-nilai-mutlak-pdf.yml'
      - 'SMA/UTBK/Matematika/Nilai_Mutlak/Soal/Soal_Nilai_Mutlak_SMA_UTBK.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-science

      - name: Compile PDF
        working-directory: SMA/UTBK/Matematika/Nilai_Mutlak/Soal
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error Soal_Nilai_Mutlak_SMA_UTBK.tex
          pdflatex -interaction=nonstopmode -halt-on-error Soal_Nilai_Mutlak_SMA_UTBK.tex

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SMA/UTBK/Matematika/Nilai_Mutlak/Soal/Soal_Nilai_Mutlak_SMA_UTBK.pdf
          if git diff --cached --quiet; then
            echo "PDF already up to date"
          else
            git commit -m "Build PDF UTBK absolute value question set"
            git push
          fi
