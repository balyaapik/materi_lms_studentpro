name: Generate PAPS Verbal bank

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_paps_verbal_10_packages.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate 10 HTML packages
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_paps_verbal_10_packages.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SMA/PAPS/Verbal/Bank_Soal/PAPS_Verbal_Paket_*.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Tambah 10 paket soal PAPS Verbal 5 opsi'
          git push origin HEAD:main
